apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  sources:
    - repoURL: https://charts.gabe565.com
      chart: paperless-ngx
      targetRevision: "0.24.1"
      helm:
        valueFiles:
          - $values/apps/paperless/values.yaml
    - repoURL: https://github.com/YOUR_GH_USERNAME/YOUR_GITOPS_REPO.git   # <-- CHANGE ME
      targetRevision: main
      ref: values
    - repoURL: https://github.com/YOUR_GH_USERNAME/YOUR_GITOPS_REPO.git   # <-- CHANGE ME
      targetRevision: main
      path: apps/paperless/extra   # Ingress + PVC overrides
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
