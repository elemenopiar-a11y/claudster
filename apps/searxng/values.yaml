# Values for the kubitodev/searxng Helm chart.
# We disable the chart's own Ingress - we manage Ingress ourselves in
# apps/searxng/extra/ingress.yaml so we can add the X-Script-Name header
# that SearXNG needs to run correctly under the /search prefix.
replicaCount: 1

image:
  repository: searxng/searxng
  tag: latest

env:
  - name: SEARXNG_BASE_URL
    value: "https://yourdomain.com/search/"     # <-- CHANGE ME (must match Ingress path below)

service:
  type: ClusterIP
  port: 8080

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

# Mount our own settings.yml (created in extra/configmap-settings.yaml)
# over the chart default so base_url is respected internally too.
extraVolumes:
  - name: settings
    configMap:
      name: searxng-settings
extraVolumeMounts:
  - name: settings
    mountPath: /etc/searxng/settings.yml
    subPath: settings.yml
