# Values for gabe565/paperless-ngx Helm chart.
# This chart CAN bundle its own PostgreSQL - enabled here for simplicity.
# For anything beyond a homelab, point postgresql.enabled to false and use
# an external/managed Postgres instead.
image:
  tag: "2.14.7"

env:
  TZ: "Europe/Prague"
  PAPERLESS_URL: "https://marshlaw.uk"                 # <-- CHANGE ME
  PAPERLESS_FORCE_SCRIPT_NAME: "/paperless"                # <-- makes Paperless subpath-aware
  PAPERLESS_STATIC_URL: "/paperless/static/"
  PAPERLESS_USE_X_FORWARD_HOST: "true"
  PAPERLESS_USE_X_FORWARD_PORT: "true"
  PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
  PAPERLESS_OCR_LANGUAGE: "eng"
  PAPERLESS_TIME_ZONE: "Europe/Prague"
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_DBHOST: paperless-postgres          # our own plain Postgres (extra/postgres.yaml)
  PAPERLESS_DBNAME: paperless
  PAPERLESS_DBUSER: paperless
  PAPERLESS_DBPASS:
    valueFrom:
      secretKeyRef:
        name: paperless-db-secret
        key: password
  PAPERLESS_REDIS: redis://paperless-redis:6379   # our own plain Redis (extra/redis.yaml), no auth

#disable chart's built-in (bitnami-based) database/cache subcharts
postgresql:
  enabled: false
redis:
  enabled: false

persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: "managed-csi"     # default AKS Azure Disk storage class
    size: 5Gi
  media:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: "managed-csi"
    size: 5Gi
  export:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: "managed-csi"
    size: 5Gi
  consume:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: "managed-csi"
    size: 5Gi

# We manage Ingress ourselves in apps/paperless/extra/ingress.yaml
ingress:
  main:
    enabled: false
