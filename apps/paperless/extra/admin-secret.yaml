# Paperless-ngx has NO default admin credentials out of the box - setting
# these two env vars (referenced from values.yaml via secretKeyRef) is what
# makes the container entrypoint auto-create a superuser on first startup.
# Without this secret, you'd need to kubectl exec into the pod and run
# `python manage.py createsuperuser` manually instead.
apiVersion: v1
kind: Secret
metadata:
  name: paperless-admin-secret
type: Opaque
stringData:
  username: "admin"                       # <-- CHANGE ME if you want a different username
  password: "CHANGE_ME_STRONG_PASSWORD"   # <-- CHANGE ME
