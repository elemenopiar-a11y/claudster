# Values for the official immich-app/immich-charts "immich" chart.
# This chart does NOT bundle Postgres (requires the vectorchord
# extension) - we deploy a small single-instance Postgres ourselves in
# apps/immich/extra/postgres.yaml and point env vars at it below.
# For anything beyond homelab scale, use CloudNativePG instead - see
# https://github.com/immich-app/immich-charts
#
# IMPORTANT: chart v0.13.0 introduced a BREAKING values.yaml schema change,
# rewriting the whole structure around the bjw-s "common library" pattern
# (controllers.main.containers.main...) and renaming redis -> valkey.
# The old flat structure (image.tag, env.DB_HOSTNAME, redis.enabled, etc.)
# is rejected outright by the new schema validator - that was the cause of
# the "values don't meet the specifications of the schema" error.
#
# Reference: https://github.com/immich-app/immich-charts/blob/main/charts/immich/values.yaml

# Shared settings applied to server + machine-learning + valkey containers
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.0.0
        env:
          # REDIS_HOSTNAME and IMMICH_MACHINE_LEARNING_URL already default
          # correctly via the chart's built-in templating - no need to set.
          DB_HOSTNAME: immich-postgres
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-secret     # created in extra/postgres.yaml
                key: password

immich:
  persistence:
    library:
      existingClaim: immich-library

# Chart bundles Valkey (Redis-compatible, license-driven rename) as the
# cache/queue backend - this replaces the old top-level "redis:" key.
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine
  persistence:
    data:
      enabled: true
      type: emptyDir     # fine for a homelab

server:
  enabled: true
  ingress:
    main:
      enabled: false   # we manage Ingress ourselves (extra/ingress.yaml) - Immich needs its own subdomain, no subpath support