apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  labels:
    app.kubernetes.io/part-of: homepage
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marshlaw.uk</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 3rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
    </head>
    <body>

    <div class="container">
    <h1>marshlaw.uk</h1>

    <p>
        Welcome to my personal site.
        Select a service below.
    </p>

    <div class="buttons">
        <a href="/search">Search</a>
        <a href="/paperless">Documents</a>
        <a href="https://photos.marshlaw.uk">Photos</a>
        	
    </div>

    <footer>
        © 2026 marshlaw.uk
    </footer>
    </div>

    </body>
    </html>