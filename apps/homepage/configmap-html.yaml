apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  labels:
    app.kubernetes.io/part-of: homepage
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <title>Home</title>
      <style>
        body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0;
               display:flex; flex-direction:column; align-items:center; justify-content:center;
               height:100vh; margin:0; }
        h1 { font-weight:300; }
        a { color:#38bdf8; text-decoration:none; font-size:1.2rem; margin:.5rem; }
        .links { display:flex; gap:1.5rem; margin-top:1.5rem; }
      </style>
    </head>
    <body>
      <h1>Welcome</h1>
      <div class="links">
        <a href="/search">Search</a>
        <a href="/paperless">Documents</a>
        <a href="https://photos.yourdomain.com">Photos</a>
      </div>
    </body>
    </html>
